
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060609"/>
      <stop offset="60%" stop-color="#0a0a12"/>
      <stop offset="100%" stop-color="#050507"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#00b0ff"/>
    </linearGradient>
    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
      <pattern id="pat" width="100" height="100" patternUnits="userSpaceOnUse">
        <rect width="100" height="100" fill="#041217"/>
        <circle cx="50" cy="50" r="35" fill="none" stroke="#00e5ff" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.35"/>
        <line x1="50" y1="5" x2="50" y2="95" stroke="#00e5ff" stroke-width="1.5" opacity="0.4"/>
        <line x1="5" y1="50" x2="95" y2="50" stroke="#00e5ff" stroke-width="1.5" opacity="0.4"/>
      </pattern>
    
  </defs>

  <!-- Base Dark Canvas -->
  <rect width="800" height="800" fill="url(#bgGrad)"/>

  <!-- Character Haori Motif Pattern Background -->
  <rect x="30" y="30" width="740" height="740" rx="12" fill="url(#pat)" opacity="0.65"/>
  <rect x="30" y="30" width="740" height="740" rx="12" fill="none" stroke="#00e5ff" stroke-width="1.5" opacity="0.4"/>

  <!-- Large Faint Japanese Watermark Behind Centerpiece -->
  <text x="400" y="470" font-family="'Cinzel', 'Noto Sans JP', 'Hiragino Mincho ProN', serif" font-size="340" font-weight="900" fill="#00e5ff" opacity="0.08" text-anchor="middle">滅</text>

  <!-- Technical Framing Marks -->
  <path d="M50,80 L50,50 L80,50 M720,50 L750,50 L750,80 M750,720 L750,750 L720,750 M80,750 L50,750 L50,720" fill="none" stroke="#00e5ff" stroke-width="2" opacity="0.8"/>

  <!-- Header Cluster -->
  <g transform="translate(60, 75)">
    <text x="0" y="0" font-family="'Outfit', sans-serif" font-size="12" font-weight="800" letter-spacing="4" fill="#00e5ff">
      INFINITY CASTLE // DEMON SLAYER ARCHIVE 2026
    </text>
    <text x="0" y="24" font-family="'Cinzel', serif" font-size="20" font-weight="900" letter-spacing="2" fill="#ffffff">
      AKAZA // <tspan fill="#00e5ff">UPPER MOON THREE</tspan>
    </text>
    <text x="0" y="44" font-family="'Noto Sans JP', serif" font-size="14" font-weight="500" letter-spacing="1" fill="#8e8e9f">
      猗窩座 破壊殺 羅針盤 終式
    </text>
  </g>

  <!-- Drop Badge Top Right -->
  <g transform="translate(620, 60)">
    <rect width="120" height="32" rx="4" fill="#000000" stroke="#00e5ff" stroke-width="1.5"/>
    <text x="60" y="20" font-family="'Outfit', sans-serif" font-size="11" font-weight="800" letter-spacing="2" fill="#00e5ff" text-anchor="middle">
      LOOKBOOK 04
    </text>
  </g>

  <!-- Central Streetwear Object Silhouette -->
  
      <g transform="translate(240, 190) scale(1.15)" filter="url(#glow)">
        <!-- Boxy Oversized Tee Body -->
        <path d="M100,50 L160,50 L220,80 L255,150 L205,170 L185,140 L185,320 L75,320 L75,140 L55,170 L5,150 L40,80 Z" fill="#0f0f14" stroke="#00e5ff" stroke-width="3"/>
        <!-- Crewneck Collar -->
        <path d="M100,50 Q130,75 160,50" fill="none" stroke="#00e5ff" stroke-width="3"/>
        <!-- Massive Center Graphic Art Area -->
        <rect x="85" y="100" width="90" height="130" fill="#050508" stroke="#00b0ff" stroke-width="1.5" stroke-dasharray="4,4"/>
        <circle cx="130" cy="155" r="32" fill="none" stroke="#00e5ff" stroke-width="2"/>
        <text x="130" y="167" font-family="'Cinzel', 'Noto Sans JP', serif" font-size="34" font-weight="900" fill="#00e5ff" text-anchor="middle">滅</text>
        <text x="130" y="215" font-family="'Outfit', sans-serif" font-size="9" font-weight="700" letter-spacing="3" fill="#ffffff" text-anchor="middle">AKAZA</text>
      </g>
    

  <!-- Footer Product Title & Technical Specs -->
  <g transform="translate(60, 680)">
    <!-- Accent Line Indicator -->
    <rect x="0" y="-15" width="680" height="1" fill="url(#accentGrad)" opacity="0.5"/>
    <rect x="0" y="-16" width="60" height="3" fill="#00e5ff"/>

    <text x="0" y="15" font-family="'Outfit', sans-serif" font-size="22" font-weight="900" letter-spacing="1" fill="#ffffff">
      LOOK 04 // AKAZA DESTRUCTIVE DEATH HEAVY TEE
    </text>

    <text x="0" y="40" font-family="'Outfit', sans-serif" font-size="12" font-weight="600" letter-spacing="2" fill="#a0a0b2">
      420 GSM COMBED COTTON TEE + GYUTARO DISTRESSED CARGOS
    </text>

    <!-- Serialized Authenticity Seal -->
    <g transform="translate(560, -5)">
      <circle cx="45" cy="20" r="22" fill="#08080c" stroke="#00e5ff" stroke-width="1.5"/>
      <text x="45" y="24" font-family="'Cinzel', serif" font-size="11" font-weight="800" fill="#00e5ff" text-anchor="middle">GENUINE</text>
    </g>
  </g>
</svg>
  