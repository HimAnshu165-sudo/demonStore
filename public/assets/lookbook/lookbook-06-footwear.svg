
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060609"/>
      <stop offset="60%" stop-color="#0a0a12"/>
      <stop offset="100%" stop-color="#050507"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e676"/>
      <stop offset="100%" stop-color="#ff1744"/>
    </linearGradient>
    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
      <pattern id="pat" width="60" height="60" patternUnits="userSpaceOnUse">
        <rect width="60" height="60" fill="#0c1810"/>
        <rect width="30" height="30" fill="#00e676" opacity="0.35"/>
        <rect x="30" y="30" width="30" height="30" fill="#00e676" opacity="0.35"/>
      </pattern>
    
  </defs>

  <!-- Base Dark Canvas -->
  <rect width="800" height="800" fill="url(#bgGrad)"/>

  <!-- Character Haori Motif Pattern Background -->
  <rect x="30" y="30" width="740" height="740" rx="12" fill="url(#pat)" opacity="0.65"/>
  <rect x="30" y="30" width="740" height="740" rx="12" fill="none" stroke="#00e676" stroke-width="1.5" opacity="0.4"/>

  <!-- Large Faint Japanese Watermark Behind Centerpiece -->
  <text x="400" y="470" font-family="'Cinzel', 'Noto Sans JP', 'Hiragino Mincho ProN', serif" font-size="340" font-weight="900" fill="#00e676" opacity="0.08" text-anchor="middle">斬</text>

  <!-- Technical Framing Marks -->
  <path d="M50,80 L50,50 L80,50 M720,50 L750,50 L750,80 M750,720 L750,750 L720,750 M80,750 L50,750 L50,720" fill="none" stroke="#00e676" stroke-width="2" opacity="0.8"/>

  <!-- Header Cluster -->
  <g transform="translate(60, 75)">
    <text x="0" y="0" font-family="'Outfit', sans-serif" font-size="12" font-weight="800" letter-spacing="4" fill="#00e676">
      INFINITY CASTLE // DEMON SLAYER ARCHIVE 2026
    </text>
    <text x="0" y="24" font-family="'Cinzel', serif" font-size="20" font-weight="900" letter-spacing="2" fill="#ffffff">
      DEMON SLAYER CORPS // <tspan fill="#00e676">ARCHIVE FOOTWEAR</tspan>
    </text>
    <text x="0" y="44" font-family="'Noto Sans JP', serif" font-size="14" font-weight="500" letter-spacing="1" fill="#8e8e9f">
      無限城 零式 高密度スニーカー
    </text>
  </g>

  <!-- Drop Badge Top Right -->
  <g transform="translate(620, 60)">
    <rect width="120" height="32" rx="4" fill="#000000" stroke="#00e676" stroke-width="1.5"/>
    <text x="60" y="20" font-family="'Outfit', sans-serif" font-size="11" font-weight="800" letter-spacing="2" fill="#00e676" text-anchor="middle">
      LOOKBOOK 06
    </text>
  </g>

  <!-- Central Streetwear Object Silhouette -->
  
      <g transform="translate(180, 220) scale(1.15)" filter="url(#glow)">
        <!-- Sneaker Chunky Sole -->
        <path d="M30,220 Q80,240 220,240 Q320,240 380,210 Q390,200 370,190 Q300,195 200,195 Q80,195 40,200 Z" fill="#1b1b24" stroke="#00e676" stroke-width="3"/>
        <path d="M40,240 L380,240 L370,255 L50,255 Z" fill="#00e676" opacity="0.8"/>
        <!-- Sneaker High-Top Upper Body -->
        <path d="M60,190 L70,80 Q90,50 140,50 L180,90 L260,130 Q330,150 360,190 Z" fill="#101016" stroke="#00e676" stroke-width="2.5"/>
        <!-- Ankle Collar & Pull Tab -->
        <path d="M140,50 L170,40 L160,85 Z" fill="#ff1744" opacity="0.9"/>
        <!-- Demon Crest Emblem / Kanji on Quarter Panel -->
        <circle cx="160" cy="130" r="28" fill="#08080c" stroke="#00e676" stroke-width="2"/>
        <text x="160" y="140" font-family="'Cinzel', 'Noto Sans JP', serif" font-size="26" font-weight="900" fill="#00e676" text-anchor="middle">斬</text>
        <!-- Lacing System & 3M Reflective Trails -->
        <path d="M165,95 L245,145 M175,110 L255,160 M185,125 L265,175" stroke="#ff1744" stroke-width="3" stroke-linecap="round"/>
        <!-- Toe Guard -->
        <path d="M320,165 Q360,175 365,190" stroke="#00e676" stroke-width="4" fill="none"/>
      </g>
    

  <!-- Footer Product Title & Technical Specs -->
  <g transform="translate(60, 680)">
    <!-- Accent Line Indicator -->
    <rect x="0" y="-15" width="680" height="1" fill="url(#accentGrad)" opacity="0.5"/>
    <rect x="0" y="-16" width="60" height="3" fill="#00e676"/>

    <text x="0" y="15" font-family="'Outfit', sans-serif" font-size="22" font-weight="900" letter-spacing="1" fill="#ffffff">
      LOOK 06 // VOID-01 CYBER SAMURAI FOOTWEAR
    </text>

    <text x="0" y="40" font-family="'Outfit', sans-serif" font-size="12" font-weight="600" letter-spacing="2" fill="#a0a0b2">
      FULL-GRAIN CALFSKIN HIGH-TOP KICKS + CASTLE-RIG CHEST PACK
    </text>

    <!-- Serialized Authenticity Seal -->
    <g transform="translate(560, -5)">
      <circle cx="45" cy="20" r="22" fill="#08080c" stroke="#00e676" stroke-width="1.5"/>
      <text x="45" y="24" font-family="'Cinzel', serif" font-size="11" font-weight="800" fill="#00e676" text-anchor="middle">GENUINE</text>
    </g>
  </g>
</svg>
  