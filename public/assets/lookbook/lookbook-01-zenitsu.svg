
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060609"/>
      <stop offset="60%" stop-color="#0a0a12"/>
      <stop offset="100%" stop-color="#050507"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd600"/>
      <stop offset="100%" stop-color="#ff9100"/>
    </linearGradient>
    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
      <pattern id="pat" width="60" height="60" patternUnits="userSpaceOnUse">
        <rect width="60" height="60" fill="#181404"/>
        <polygon points="30,0 60,60 0,60" fill="#ffd600" opacity="0.25"/>
        <polygon points="30,10 50,50 10,50" fill="#ffab00" opacity="0.4"/>
      </pattern>
    
  </defs>

  <!-- Base Dark Canvas -->
  <rect width="800" height="800" fill="url(#bgGrad)"/>

  <!-- Character Haori Motif Pattern Background -->
  <rect x="30" y="30" width="740" height="740" rx="12" fill="url(#pat)" opacity="0.65"/>
  <rect x="30" y="30" width="740" height="740" rx="12" fill="none" stroke="#ffd600" stroke-width="1.5" opacity="0.4"/>

  <!-- Large Faint Japanese Watermark Behind Centerpiece -->
  <text x="400" y="470" font-family="'Cinzel', 'Noto Sans JP', 'Hiragino Mincho ProN', serif" font-size="340" font-weight="900" fill="#ffd600" opacity="0.08" text-anchor="middle">雷</text>

  <!-- Technical Framing Marks -->
  <path d="M50,80 L50,50 L80,50 M720,50 L750,50 L750,80 M750,720 L750,750 L720,750 M80,750 L50,750 L50,720" fill="none" stroke="#ffd600" stroke-width="2" opacity="0.8"/>

  <!-- Header Cluster -->
  <g transform="translate(60, 75)">
    <text x="0" y="0" font-family="'Outfit', sans-serif" font-size="12" font-weight="800" letter-spacing="4" fill="#ffd600">
      INFINITY CASTLE // DEMON SLAYER ARCHIVE 2026
    </text>
    <text x="0" y="24" font-family="'Cinzel', serif" font-size="20" font-weight="900" letter-spacing="2" fill="#ffffff">
      ZENITSU AGATSUMA // <tspan fill="#ffd600">FINAL FORM</tspan>
    </text>
    <text x="0" y="44" font-family="'Noto Sans JP', serif" font-size="14" font-weight="500" letter-spacing="1" fill="#8e8e9f">
      雷の呼吸 壱ノ型 霹靂一閃 神速
    </text>
  </g>

  <!-- Drop Badge Top Right -->
  <g transform="translate(620, 60)">
    <rect width="120" height="32" rx="4" fill="#000000" stroke="#ffd600" stroke-width="1.5"/>
    <text x="60" y="20" font-family="'Outfit', sans-serif" font-size="11" font-weight="800" letter-spacing="2" fill="#ffd600" text-anchor="middle">
      LOOKBOOK 01
    </text>
  </g>

  <!-- Central Streetwear Object Silhouette -->
  
      <g transform="translate(250, 180) scale(1.1)" filter="url(#glow)">
        <!-- Hoodie Body -->
        <path d="M100,50 L160,50 L200,90 L260,110 L230,190 L190,170 L190,320 L70,320 L70,170 L30,190 L0,110 L60,90 Z" fill="#121218" stroke="#ffd600" stroke-width="3"/>
        <!-- Hood Inner & Collar -->
        <path d="M100,50 C100,0 160,0 160,50 C160,85 100,85 100,50 Z" fill="#08080c" stroke="#ffd600" stroke-width="2.5"/>
        <!-- Chest Demon Motif / Kanji -->
        <circle cx="130" cy="140" r="36" fill="none" stroke="#ffd600" stroke-width="2" stroke-dasharray="6,4"/>
        <text x="130" y="152" font-family="'Cinzel', 'Noto Sans JP', serif" font-size="34" font-weight="900" fill="#ffd600" text-anchor="middle">雷</text>
        <!-- Ribbed hem and pocket lines -->
        <line x1="85" y1="240" x2="175" y2="240" stroke="#ffd600" stroke-width="2" opacity="0.6"/>
        <path d="M90,240 L105,290 L155,290 L170,240" fill="none" stroke="#ffd600" stroke-width="1.5" opacity="0.5"/>
        <!-- Sleeve Details -->
        <line x1="20" y1="125" x2="50" y2="175" stroke="#ff9100" stroke-width="2" opacity="0.7"/>
        <line x1="240" y1="125" x2="210" y2="175" stroke="#ff9100" stroke-width="2" opacity="0.7"/>
      </g>
    

  <!-- Footer Product Title & Technical Specs -->
  <g transform="translate(60, 680)">
    <!-- Accent Line Indicator -->
    <rect x="0" y="-15" width="680" height="1" fill="url(#accentGrad)" opacity="0.5"/>
    <rect x="0" y="-16" width="60" height="3" fill="#ffd600"/>

    <text x="0" y="15" font-family="'Outfit', sans-serif" font-size="22" font-weight="900" letter-spacing="1" fill="#ffffff">
      LOOK 01 // ZENITSU THUNDER VELOCITY
    </text>

    <text x="0" y="40" font-family="'Outfit', sans-serif" font-size="12" font-weight="600" letter-spacing="2" fill="#a0a0b2">
      520 GSM GOLD EMBROIDERED HOODIE + THUNDER-X CHUNKY RUNNERS
    </text>

    <!-- Serialized Authenticity Seal -->
    <g transform="translate(560, -5)">
      <circle cx="45" cy="20" r="22" fill="#08080c" stroke="#ffd600" stroke-width="1.5"/>
      <text x="45" y="24" font-family="'Cinzel', serif" font-size="11" font-weight="800" fill="#ffd600" text-anchor="middle">GENUINE</text>
    </g>
  </g>
</svg>
  